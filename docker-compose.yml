services:
  postgres:
    image: postgres:16-alpine
    container_name: kosthub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kosthub
      POSTGRES_PASSWORD: kosthub_secret
      POSTGRES_DB: kosthub_db
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kosthub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: kosthub_backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: kosthub_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata: